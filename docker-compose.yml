# ---------------------------------------------------------------------------
# docker-compose.yml — one-command local stack
#
#   docker compose up --build     start MySQL + the app on https://localhost
#   docker compose exec app php artisan tinker
#   docker compose down           stop (keeps volumes / your data)
#   docker compose down -v        stop and delete the database volume
#
# Credentials here are for LOCAL DEVELOPMENT ONLY. Never reuse them in
# production.
# ---------------------------------------------------------------------------
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-cms-blog:latest
    restart: unless-stopped
    # php-fpm answers FastCGI on 127.0.0.1:9000 while nginx serves port 80
    # (redirecting to HTTPS) and port 443 (TLS, self-signed cert generated by
    # the entrypoint on first boot).
    # The entrypoint runs migrations/seeders first, then execs this command.
    command: ["sh", "-c", "php-fpm -D && exec nginx -g 'daemon off;'"]
    ports:
      - "80:80"
      - "443:443"
    # Optional: if you already have a .env it is loaded automatically,
    # otherwise the container generates one from .env.example on boot.
    env_file:
      - path: .env
        required: false
    environment:
      # Override the local defaults from .env so the container talks to the
      # "mysql" service instead of 127.0.0.1.
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-https://localhost}

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-cms_blog}
      DB_USERNAME: ${DB_USERNAME:-cms_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}

      # Sessions, cache and queues are stored in the database driver, so the
      # schema must exist before the app serves traffic.
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database

      # Seed the demo content on first boot (roles, admin, categories, posts).
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: ${RUN_SEEDERS:-true}

      # Seeded admin account. In APP_ENV=local a fixed password is allowed;
      # the seeder generates a random one otherwise.
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@example.com}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-AdminPass123!}
    volumes:
      # Persist uploads and logs across container restarts.
      - storage:/var/www/html/storage
      # Persist the TLS certificate so it stays stable across restarts
      # (replace it with a real certificate to remove the browser warning).
      - certs:/etc/nginx/certs
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cms_blog}
      MYSQL_USER: ${DB_USERNAME:-cms_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      # Exposed so you can connect with a desktop client; change or remove
      # the mapping if port 3306 is already taken on your machine.
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  dbdata:
  # Persist uploaded media and logs.
  storage:
  # Persist the self-signed TLS certificate so nginx keeps the same one
  # across container restarts.
  certs: